name: Server Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker and production ports
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            echo "OS=$(uname -s)"
            echo "SSH_ID=$(id -u):$(id -g)"
            echo "SSH_GROUP_IDS=$(id -G)"
            if [ -n "${DOCKER_HOST:-}" ]; then echo "DOCKER_HOST_CONFIGURED=yes"; else echo "DOCKER_HOST_CONFIGURED=no"; fi
            if [ -n "${DOCKER_CONTEXT:-}" ]; then echo "DOCKER_CONTEXT_CONFIGURED=yes"; else echo "DOCKER_CONTEXT_CONFIGURED=no"; fi
            echo "DOCKER_CONTEXT_CURRENT=$(docker context show 2>/dev/null || echo unavailable)"
            if bash -lc 'docker ps >/dev/null 2>&1'; then
              echo "LOGIN_SHELL_DOCKER_ACCESSIBLE=yes"
              echo "LOGIN_SHELL_DOCKER_CONTEXT=$(bash -lc 'docker context show 2>/dev/null || echo unavailable')"
            else
              echo "LOGIN_SHELL_DOCKER_ACCESSIBLE=no"
              bash -lc 'docker ps 2>&1 | tail -n 2'
            fi
            if [ -S /var/run/docker.sock ]; then stat -c 'DOCKER_SOCKET=%A %U:%G' /var/run/docker.sock; else echo "DOCKER_SOCKET=missing"; fi
            if [ -n "${XDG_RUNTIME_DIR:-}" ] && [ -S "$XDG_RUNTIME_DIR/docker.sock" ]; then stat -c 'ROOTLESS_DOCKER_SOCKET=%A %U:%G' "$XDG_RUNTIME_DIR/docker.sock"; else echo "ROOTLESS_DOCKER_SOCKET=missing"; fi
            if command -v systemctl >/dev/null 2>&1; then echo "DOCKER_SERVICE=$(systemctl is-active docker 2>/dev/null || echo unavailable)"; fi
            if command -v docker >/dev/null 2>&1; then
              echo "DOCKER_CLI=present"
              docker --version
              if docker compose version >/dev/null 2>&1; then echo "COMPOSE=present"; else echo "COMPOSE=missing"; fi
              if docker info >/dev/null 2>&1; then
                echo "DOCKER_DAEMON=accessible"
                docker ps --format 'DOCKER_PS={{.Names}} {{.Status}}' | head -n 5
              elif docker ps >/dev/null 2>&1; then
                echo "DOCKER_PS_ACCESSIBLE=yes"
              elif sudo -n docker info >/dev/null 2>&1; then
                echo "DOCKER_DAEMON=sudo-accessible"
                sudo -n docker ps --format 'SUDO_DOCKER_PS={{.Names}} {{.Status}}' | head -n 5
              else
                echo "DOCKER_DAEMON=not-accessible"
                docker info 2>&1 | tail -n 3
                sudo -n docker info 2>&1 | tail -n 3
              fi
            else
              echo "DOCKER_CLI=missing"
            fi
            if command -v ss >/dev/null 2>&1; then
              for port in 80 443 3000 8000 3306; do
                if ss -lnt | grep -Eq "LISTEN.+:${port}[[:space:]]"; then
                  echo "PORT_${port}=listening"
                else
                  echo "PORT_${port}=free"
                fi
              done
            else
              echo "SS_COMMAND=missing"
            fi
