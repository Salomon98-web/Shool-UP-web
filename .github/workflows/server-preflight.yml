name: Server Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker and production ports
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            echo "OS=$(uname -s)"
            echo "SSH_GROUPS=$(id -nG)"
            if [ -S /var/run/docker.sock ]; then stat -c 'DOCKER_SOCKET=%A %U:%G' /var/run/docker.sock; else echo "DOCKER_SOCKET=missing"; fi
            if command -v systemctl >/dev/null 2>&1; then echo "DOCKER_SERVICE=$(systemctl is-active docker 2>/dev/null || echo unavailable)"; fi
            if command -v docker >/dev/null 2>&1; then
              echo "DOCKER_CLI=present"
              docker --version
              if docker compose version >/dev/null 2>&1; then echo "COMPOSE=present"; else echo "COMPOSE=missing"; fi
              if docker info >/dev/null 2>&1; then
                echo "DOCKER_DAEMON=accessible"
              elif sudo -n docker info >/dev/null 2>&1; then
                echo "DOCKER_DAEMON=sudo-accessible"
              else
                echo "DOCKER_DAEMON=not-accessible"
                docker info 2>&1 | head -n 1
                sudo -n docker info 2>&1 | head -n 1
              fi
            else
              echo "DOCKER_CLI=missing"
            fi
            if command -v ss >/dev/null 2>&1; then
              for port in 80 443 3000 8000 3306; do
                if ss -lnt | grep -Eq "LISTEN.+:${port}[[:space:]]"; then
                  echo "PORT_${port}=listening"
                else
                  echo "PORT_${port}=free"
                fi
              done
            else
              echo "SS_COMMAND=missing"
            fi
