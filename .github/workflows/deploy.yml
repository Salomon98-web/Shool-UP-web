name: Deploy

on:
  push:
    branches: [main, dev, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy branch on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          FOLDER: ${{ secrets.FOLDER }}
          BRANCH: ${{ github.ref_name }}
          REPO: https://github.com/Salomon98-web/Shool-UP-web.git
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          envs: FOLDER,BRANCH,REPO
          script: |
            set -u
            case "$BRANCH" in main|dev|staging) ;; *) echo "ERREUR: branche non autorisée"; exit 1 ;; esac
            case "$FOLDER" in /*) ;; *) echo "ERREUR: FOLDER doit être un chemin absolu"; exit 1 ;; esac
            TARGET="$FOLDER/$BRANCH"
            if ! mkdir -p "$FOLDER"; then echo "ERREUR: création de FOLDER refusée"; exit 1; fi
            if [ -d "$TARGET/.git" ]; then
              git -C "$TARGET" remote set-url origin "$REPO" || { echo "ERREUR: remote Git impossible à configurer"; exit 1; }
              git -C "$TARGET" fetch --prune origin "$BRANCH" || { echo "ERREUR: récupération Git impossible"; exit 1; }
              git -C "$TARGET" checkout -B "$BRANCH" "origin/$BRANCH" || { echo "ERREUR: checkout impossible"; exit 1; }
              git -C "$TARGET" reset --hard "origin/$BRANCH" || { echo "ERREUR: mise à jour Git impossible"; exit 1; }
            elif [ -e "$TARGET" ]; then
              echo "ERREUR: le dossier de branche existe, mais n'est pas un dépôt Git"
              exit 1
            else
              git clone --single-branch --branch "$BRANCH" "$REPO" "$TARGET" || { echo "ERREUR: clonage Git impossible"; exit 1; }
            fi
