name: Deploy

on:
  push:
    branches: [main, dev, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy branch on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          FOLDER: ${{ secrets.FOLDER }}
          BRANCH: ${{ github.ref_name }}
          REPO: https://github.com/Salomon98-web/Shool-UP-web.git
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          envs: FOLDER,BRANCH,REPO
          debug: true
          script_stop: true
          script: |
            set -eu
            case "$BRANCH" in main|dev|staging) ;; *) echo "Branche non autorisée" >&2; exit 1 ;; esac
            case "$FOLDER" in /*) ;; *) echo "FOLDER doit être un chemin absolu" >&2; exit 1 ;; esac
            TARGET="$FOLDER/$BRANCH"
            mkdir -p "$FOLDER"
            if [ -d "$TARGET/.git" ]; then
              git -C "$TARGET" remote set-url origin "$REPO"
              git -C "$TARGET" fetch --prune origin "$BRANCH"
              git -C "$TARGET" checkout -B "$BRANCH" "origin/$BRANCH"
              git -C "$TARGET" reset --hard "origin/$BRANCH"
            elif [ -e "$TARGET" ]; then
              echo "Le dossier cible existe déjà et n'est pas un dépôt Git: $TARGET" >&2
              exit 1
            else
              git clone --single-branch --branch "$BRANCH" "$REPO" "$TARGET"
            fi
