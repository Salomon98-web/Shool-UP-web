services:
  schoolup-web:
    container_name: schoolup-web-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_BASE_URL2: ${NEXT_PUBLIC_BASE_URL2:?Set NEXT_PUBLIC_BASE_URL2}
        NEXT_PUBLIC_BASE_URL3: ${NEXT_PUBLIC_BASE_URL3:?Set NEXT_PUBLIC_BASE_URL3}
        NEXT_PUBLIC_BASE_URL4: ${NEXT_PUBLIC_BASE_URL4:?Set NEXT_PUBLIC_BASE_URL4}
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:3000:3000"
